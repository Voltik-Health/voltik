# =============================================================================
# VOLTIK · LOCAL database (optional)
# Day-to-day work is tested on STAGING (see docs/guides/00-getting-started.md).
# This is only for trying a migration on your Mac before sending it to staging,
# so you don't break staging for the other developer.
#   docker compose up -d db
#   docker compose --profile tools run --rm migrate up
# =============================================================================
services:
  db:
    image: postgres:17-alpine
    container_name: voltik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VOLTIK_MIGRATIONS_PASSWORD: ${VOLTIK_MIGRATIONS_PASSWORD:?set in .env}
      VOLTIK_API_PASSWORD: ${VOLTIK_API_PASSWORD:?set in .env}
      VOLTIK_READONLY_PASSWORD: ${VOLTIK_READONLY_PASSWORD:?set in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - voltik_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 makes sure it only reports "ready" after initialisation has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d voltik"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://voltik_migrations:${VOLTIK_MIGRATIONS_PASSWORD}@db:5432/voltik?sslmode=disable

volumes:
  voltik_pgdata:
