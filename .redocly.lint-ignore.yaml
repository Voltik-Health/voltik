# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
api/openapi.yaml:
  # GET /v1/health and the Nightscout status are public and take no input,
  # so they have no 4xx response.
  operation-4xx-response:
    - '#/paths/~1v1~1health/get/responses'
    - '#/paths/~1v1~1nightscout~1api~1v1~1status.json/get/responses'
