# =============================================================================
# VOLTIK · services of ONE environment on the server (staging OR production)
# Not used by hand: infra/server/deploy.sh calls it with
#   -p voltik-staging  or  -p voltik-production
# Each environment has its own database, volume and .env file.
# =============================================================================
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      VOLTIK_MIGRATIONS_PASSWORD: ${VOLTIK_MIGRATIONS_PASSWORD:?missing in .env}
      VOLTIK_API_PASSWORD: ${VOLTIK_API_PASSWORD:?missing in .env}
      VOLTIK_READONLY_PASSWORD: ${VOLTIK_READONLY_PASSWORD:?missing in .env}
      TZ: UTC
    ports:
      # Reachable only from the server itself (DBeaver gets here through an SSH tunnel)
      - "127.0.0.1:${DB_TUNNEL_PORT:?missing in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${VOLTIK_DIR:?}/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d voltik"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${VOLTIK_DIR:?}/database/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://voltik_migrations:${VOLTIK_MIGRATIONS_PASSWORD}@db:5432/voltik?sslmode=disable
    networks: [internal]

  api:
    image: voltik-api:${VERSION:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?}
      PORT: "8080"
      DATABASE_URL: postgres://voltik_api:${VOLTIK_API_PASSWORD}@db:5432/voltik?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      internal: {}
      proxy:
        aliases: ["${ENVIRONMENT}-api"]   # Caddy finds it as staging-api or production-api

volumes:
  pgdata:

networks:
  internal: {}
  proxy:
    external: true
    name: voltik-proxy
