# Single HTTPS proxy for both environments. Start it once on the server:
#   cd infra/proxy && docker compose up -d
# HTTPS certificates (Let's Encrypt) are obtained and renewed automatically.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: voltik-proxy
