        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
              example:
                items:
                  - id: 68000000-0000-4000-8000-000000000001
                    period_type: week
                    start_date: '2026-10-09'
                    end_date: '2026-10-15'
                    generated_by_role: patient
                    target_min_mg_dl: 70
                    target_max_mg_dl: 180
                    coverage_percent: 98.2
                    low_coverage: false
                    time_in_range_percent: 72.4
                    time_below_range_percent: 3.1
                    time_above_range_percent: 24.5
                    mean_glucose_mg_dl: 152
                    std_dev_mg_dl: 48.6
                    coefficient_of_variation_percent: 32
                    gmi_percent: 6.95
                    hypo_episodes: 2
                    hyper_episodes: 7
                    iris_summary: Esta semana passou 72 % do tempo dentro do intervalo alvo, perto da meta de 70 %. As subidas foram mais frequentes ao fim da tarde.
                    work_impact_analysis: Nos dias de turno da tarde, a glicemia subiu mais depois do almoço. Vale a pena falar disto na próxima consulta.
                    created_at: '2026-10-16T09:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
    post:
      tags: [Reports]
      operationId: createReport
      summary: Generate a clinical report
      description: |
        Computes the metrics of `GET /v1/me/stats` for whole days (in Portugal)
        and saves them, so the report can be shared with the doctor. The period
        can be at most 90 days and cannot end after today.

        With the `external_ai_processing` consent, the report also has a plain
        summary written by Iris and an analysis of the impact on work (Iris only
        receives numbers, never who the patient is). Without the consent, or if
        Iris does not answer, these fields are `null`. A period without readings
        answers 409 `no_readings`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
            example:
              period_type: week
              start_date: '2026-10-09'
              end_date: '2026-10-15'
      responses:
        '201':
          description: Report saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalReport'
              example:
                id: 68000000-0000-4000-8000-000000000001
                period_type: week
                start_date: '2026-10-09'
                end_date: '2026-10-15'
                generated_by_role: patient
                target_min_mg_dl: 70
                target_max_mg_dl: 180
                coverage_percent: 98.2
                low_coverage: false
                time_in_range_percent: 72.4
                time_below_range_percent: 3.1
                time_above_range_percent: 24.5
                mean_glucose_mg_dl: 152
                std_dev_mg_dl: 48.6
                coefficient_of_variation_percent: 32
                gmi_percent: 6.95
                hypo_episodes: 2
                hyper_episodes: 7
                iris_summary: Esta semana passou 72 % do tempo dentro do intervalo alvo, perto da meta de 70 %. As subidas foram mais frequentes ao fim da tarde.
                work_impact_analysis: Nos dias de turno da tarde, a glicemia subiu mais depois do almoço. Vale a pena falar disto na próxima consulta.
                created_at: '2026-10-16T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
        '409':
          description: The period has no glucose readings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: no_readings
                message: There are no glucose readings between 2026-10-09 and 2026-10-15.
                details: []

