      summary: Glucose grouped in time buckets, for long charts
      description: |
        Mean, minimum and maximum of each bucket, for charts longer than 7 days.
        The buckets start at `from` and last `resolution`. Buckets without
        readings are left out. The range can be at most 90 days.
      parameters:
