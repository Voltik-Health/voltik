openapi: 3.0.3
info:
  title: Voltik API
  version: 0.1.0
  description: Single contract for the Voltik API, shared by the Android and iOS apps and the web portal.
servers:
  - url: https://staging-api.example.com/v1
    description: Staging
paths:
  /health:
    get:
      summary: Checks that the API is running
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  environment:
                    type: string
                    example: staging
                  version:
                    type: string
                    example: 3f2a9c1b7e44
