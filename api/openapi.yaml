  /v1/me/stats:
    get:
      tags: [Stats]
      operationId: getGlucoseStats
      summary: Glucose metrics for a period
      description: |
        The metrics of the international consensus on time in range, computed
        with the patient's current target range (returned in the response):

        - TIR, TBR and TAR: share of readings in, below and above the range.
        - GMI (estimated HbA1c) = 3.31 + 0.02392 × mean glucose.
        - An episode is a run of at least 15 minutes below (hypo) or above
          (hyper) the range.
        - `coverage_percent`: share of 5-minute slots with a reading. Below 70 %
          the metrics are not reliable enough for clinical conclusions.

        Without readings the metrics are `null`. The range can be at most 90 days.
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseStats'
              example:
                from: '2026-10-09T00:00:00Z'
                to: '2026-10-16T00:00:00Z'
                target_min_mg_dl: 70
                target_max_mg_dl: 180
                readings_count: 1980
                coverage_percent: 98.2
                time_in_range_percent: 72.4
                time_below_range_percent: 3.1
                time_above_range_percent: 24.5
                mean_glucose_mg_dl: 152
                std_dev_mg_dl: 48.6
                coefficient_of_variation_percent: 32
                gmi_percent: 6.95
                hypo_episodes: 2
                hyper_episodes: 7
                active_minutes: 210
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'

  /v1/me/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List the patient's clinical reports
