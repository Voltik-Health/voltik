                  summary: Onboarding not completed
                  value:
                    code: patient_profile_not_found
                    message: Complete onboarding with POST /v1/me/patient first.
                    details: []

  /v1/me/alerts/{alert_id}/resolve:
    post:
      tags: [Alerts]
      operationId: resolveAlert
      summary: Close an alert
      description: |
        `resolved` closes an alert that was handled, optionally with a note.
        `dismissed` closes a false alarm, e.g. a low reading caused by pressure
        on the sensor. Closing an alert stops its escalation. A closed alert
        never goes back to pending, and closing it again returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertResolution'
            example:
              status: resolved
              resolution_notes: Comi um sumo e a glicemia voltou aos 95.
      responses:
        '200':
          description: The alert after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
              example:
                id: 80000000-0000-4000-8000-000000000002
                alert_type: critical_low
                severity: critical
                title: Glicemia muito baixa
                message: A glicemia está em 52 mg/dL e a descer.
                iris_suggested_action: Siga o seu plano para hipoglicemia e volte a medir dentro de 15 minutos.
                triggered_at: '2026-10-15T16:42:00Z'
                ack_status: resolved
                acknowledged_at: '2026-10-15T16:43:10Z'
                resolution_notes: Comi um sumo e a glicemia voltou aos 95.
                source_reading_id: 183950
                source_prediction_id: null
                device_id: null
                source_value_mg_dl: 52
                acknowledged_by:
                  user_id: 20000000-0000-4000-8000-000000000001
                  full_name: Manuel Sousa
                recipients:
                  - id: 81000000-0000-4000-8000-000000000001
                    user_id: 20000000-0000-4000-8000-000000000001
                    full_name: Manuel Sousa
                    channel: push
                    delivery_status: acknowledged
                    sent_at: '2026-10-15T16:42:02Z'
                    delivered_at: '2026-10-15T16:42:03Z'
                    read_at: '2026-10-15T16:43:05Z'
                    acknowledged_at: '2026-10-15T16:43:10Z'
                created_at: '2026-10-15T16:42:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/notifications/{recipient_id}/delivered:
    post:
      tags: [Notifications]
      operationId: markNotificationDelivered
      summary: Report that a notification reached the phone
      description: |
        Call it when the app receives an alert push (`recipient_id` comes in the
        message) or shows an alert inside the app (its `recipients` row for the
        channel `in_app`). The state never goes back: a notification that was
        already read stays read.
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      responses:
        '204':
          description: Receipt recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/notifications/{recipient_id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Report that the user opened a notification
      description: Call it when the user taps the push or opens the alert in the app.
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      responses:
        '204':
          description: Receipt recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the patient's devices
      responses:
        '200':
          description: The patient's devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
              example:
                items:
                  - id: 50000000-0000-4000-8000-000000000001
                    device_type: cgm_sensor
                    brand_model: Voltik CGM simulator
                    serial_or_mac: SIM-0001
                    connection_status: active
                    battery_percent: null
                    first_reading_at: '2026-10-01T08:20:00Z'
                    sensor_expires_at: '2026-10-15T08:20:00Z'
                    last_synced_at: '2026-10-16T09:25:05Z'
                    created_at: '2026-10-01T08:18:00Z'
                    updated_at: '2026-10-16T09:25:05Z'
                  - id: 50000000-0000-4000-8000-000000000002
                    device_type: smartwatch
                    brand_model: Samsung Galaxy Watch6
                    serial_or_mac: 'D4:3A:2C:91:7F:10'
                    connection_status: active
                    battery_percent: 64
                    first_reading_at: '2026-10-02T07:05:00Z'
                    sensor_expires_at: null
                    last_synced_at: '2026-10-16T09:30:12Z'
                    created_at: '2026-10-02T07:01:00Z'
                    updated_at: '2026-10-16T09:30:12Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register a device
      description: |
        Registers a sensor, meter, watch or band. Use the returned `id` as
        `device_id` when uploading its data. Registering the same `serial_or_mac`
        again returns the existing device (200).

        A CGM sensor starts `warming_up` and becomes `active` with its first
        reading. A patient has one CGM sensor in use at a time: registering a
        second one answers 409 `active_sensor_exists`, so use
        `POST /v1/me/devices/{device_id}/replace` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            example:
              device_type: smartwatch
              brand_model: Samsung Galaxy Watch6
              serial_or_mac: 'D4:3A:2C:91:7F:10'
              battery_percent: 64
      responses:
        '200':
          description: A device with this `serial_or_mac` was already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 50000000-0000-4000-8000-000000000002
                device_type: smartwatch
                brand_model: Samsung Galaxy Watch6
                serial_or_mac: 'D4:3A:2C:91:7F:10'
                connection_status: active
                battery_percent: 64
                first_reading_at: '2026-10-02T07:05:00Z'
                sensor_expires_at: null
                last_synced_at: '2026-10-16T09:30:12Z'
                created_at: '2026-10-02T07:01:00Z'
                updated_at: '2026-10-16T09:30:12Z'
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 50000000-0000-4000-8000-000000000002
                device_type: smartwatch
                brand_model: Samsung Galaxy Watch6
                serial_or_mac: 'D4:3A:2C:91:7F:10'
                connection_status: active
                battery_percent: 64
                first_reading_at: null
                sensor_expires_at: null
                last_synced_at: null
                created_at: '2026-10-02T07:01:00Z'
                updated_at: '2026-10-02T07:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
        '409':
          description: The patient already has a CGM sensor in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: active_sensor_exists
                message: Replace the CGM sensor in use with POST /v1/me/devices/{device_id}/replace.
                details: []

  /v1/me/devices/{device_id}:
    delete:
      tags: [Devices]
      operationId: removeDevice
      summary: Remove a device
      description: |
        The device stops syncing and leaves the list. Its readings stay in the
        history: removing a device never deletes data.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Device removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/devices/{device_id}/status:
    patch:
      tags: [Devices]
      operationId: updateDeviceStatus
      summary: Report the state of a device
      description: |
        The app sends the battery level, whether the device is connected and the
        time of its latest reading. The API also updates the status by itself: a
        CGM sensor leaves `warming_up` with its first reading, becomes
        `disconnected` after 20 minutes without data and `expired` once
        `sensor_expires_at` has passed.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusUpdate'
            example:
              connection_status: active
              battery_percent: 58
              last_reading_at: '2026-10-16T09:30:00Z'
      responses:
        '200':
          description: The device after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 50000000-0000-4000-8000-000000000002
                device_type: smartwatch
                brand_model: Samsung Galaxy Watch6
                serial_or_mac: 'D4:3A:2C:91:7F:10'
                connection_status: active
                battery_percent: 58
                first_reading_at: '2026-10-02T07:05:00Z'
                sensor_expires_at: null
                last_synced_at: '2026-10-16T09:30:00Z'
                created_at: '2026-10-02T07:01:00Z'
                updated_at: '2026-10-16T09:30:04Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/devices/{device_id}/replace:
    post:
      tags: [Devices]
      operationId: replaceSensor
      summary: Replace a CGM sensor
      description: |
        Pairs a new CGM sensor in place of this one, in one step. The old sensor
        becomes `replaced` and keeps its readings; the new one starts
        `warming_up`. Only CGM sensors can be replaced, and the new device must
        be a CGM sensor too.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            example:
              device_type: cgm_sensor
              brand_model: Voltik CGM simulator
              serial_or_mac: SIM-0002
              sensor_expires_at: '2026-10-30T09:40:00Z'
      responses:
        '201':
          description: The new sensor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 50000000-0000-4000-8000-000000000003
                device_type: cgm_sensor
                brand_model: Voltik CGM simulator
                serial_or_mac: SIM-0002
                connection_status: warming_up
                battery_percent: null
                first_reading_at: null
                sensor_expires_at: '2026-10-30T09:40:00Z'
                last_synced_at: null
                created_at: '2026-10-16T09:40:00Z'
                updated_at: '2026-10-16T09:40:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/me/devices/{device_id}/nightscout-secret:
    post:
      tags: [Devices]
      operationId: createNightscoutSecret
      summary: Let Juggluco or xDrip+ upload this sensor's readings
      description: |
        For testing with a real CGM sensor. Apps such as Juggluco and xDrip+
        read FreeStyle Libre and Dexcom sensors over Bluetooth and can upload
        each reading to a Nightscout server. Voltik answers the Nightscout
        upload API: put `nightscout_url` and `api_secret` in the app's
        Nightscout settings, and every reading reaches Voltik within a minute,
        with alerts and push.

        The device must be a CGM sensor. The secret is shown only once; asking
        again creates a new one and the old one stops working. These apps are
        not certified medical devices: use them for testing only.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '201':
          description: The settings for the uploader app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NightscoutSecret'
              example:
                nightscout_url: https://voltik-cgm-staging.duckdns.org/v1/nightscout
                api_secret: k7qm3x9vfa2wp8re
                created_at: '2026-11-20T21:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/nightscout/api/v1/entries:
    post:
      tags: [Integrations]
      operationId: uploadNightscoutEntries
      summary: Nightscout upload of sensor readings
      description: |
        The part of the Nightscout API that Juggluco and xDrip+ use to upload
        readings. Not for the Voltik apps. The uploader authenticates with the
        `api-secret` header: the SHA-1 of the secret from
        `POST /v1/me/devices/{device_id}/nightscout-secret` (the secret itself
        is accepted too). `sgv` entries become CGM readings of that sensor,
        `mbg` entries become manual readings, and other types are ignored.
        Resending an entry changes nothing.
      security: []
      parameters:
        - name: api-secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/NightscoutEntry'
            example:
              - type: sgv
                sgv: 112
                date: 1763672400000
                dateString: '2026-11-20T21:00:00.000Z'
                direction: Flat
                device: Juggluco
      responses:
        '200':
          description: The entries that were accepted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NightscoutEntry'
              example:
                - type: sgv
                  sgv: 112
                  date: 1763672400000
                  dateString: '2026-11-20T21:00:00.000Z'
                  direction: Flat
                  device: Juggluco
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    get:
      tags: [Integrations]
      operationId: listNightscoutEntries
      summary: Latest readings of the sensor, in Nightscout format
      description: Some uploaders read the latest entries to avoid gaps. Newest first.
      security: []
      parameters:
        - name: api-secret
          in: header
          required: true
          schema:
            type: string
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
      responses:
        '200':
          description: The latest readings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NightscoutEntry'
              example:
                - type: sgv
                  sgv: 112
                  date: 1763672400000
                  dateString: '2026-11-20T21:00:00.000Z'
                  direction: Flat
                  device: Juggluco
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/nightscout/api/v1/status.json:
    get:
      tags: [Integrations]
      operationId: getNightscoutStatus
      summary: Nightscout server status
      description: Uploaders call it to check the connection. Works without the secret, like Nightscout.
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NightscoutStatus'
              example:
                status: ok
                name: Voltik
                version: 0.3.0
                serverTime: '2026-11-20T21:00:05.000Z'
                serverTimeEpoch: 1763672405000
                apiEnabled: true
                careportalEnabled: false
                settings:
                  units: mg/dl

  /v1/me/activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: List physical activities in a time range
      description: Activities with `from <= started_at < to`, oldest first. The range can be at most 90 days.
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
      responses:
        '200':
          description: The activities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
              example:
                items:
                  - id: 67000000-0000-4000-8000-000000000001
                    activity_name: Caminhada
                    started_at: '2026-10-16T07:10:00Z'
                    duration_minutes: 35
                    intensity: moderate
                    total_steps: 4120
                    avg_heart_rate_bpm: 104
                    calories_burned_kcal: 180
                    device_id: 50000000-0000-4000-8000-000000000002
                    idempotency_key: hc-exercise-7f3a91c2
                    created_at: '2026-10-16T08:00:12Z'
                    updated_at: '2026-10-16T08:00:12Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
    post:
      tags: [Activities]
      operationId: createActivity
      summary: Log a physical activity
      description: |
        An activity typed by the patient. Sending an `idempotency_key` that is
        already stored returns that activity (200) and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
            example:
              idempotency_key: 2c1f7b9e-3d4a-4e5f-8a6b-7c8d9e0f1a2b
              activity_name: Jardinagem
              started_at: '2026-10-16T16:00:00Z'
              duration_minutes: 45
              intensity: light
      responses:
        '200':
          description: An activity with this `idempotency_key` was already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 67000000-0000-4000-8000-000000000002
                activity_name: Jardinagem
                started_at: '2026-10-16T16:00:00Z'
                duration_minutes: 45
                intensity: light
                total_steps: null
                avg_heart_rate_bpm: null
