      description: |
        Sends the items the patient accepted, after adjusting quantities or
        swapping foods. They are added to the meal and the totals are
        recalculated. An empty list rejects the proposal: the photo stays with
        the meal without items. A photo can be confirmed once; before the
        analysis ends the API answers 409 `analysis_not_ready`.
