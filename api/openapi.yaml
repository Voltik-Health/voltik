                device_id: null
                idempotency_key: 2c1f7b9e-3d4a-4e5f-8a6b-7c8d9e0f1a2b
                created_at: '2026-10-16T16:50:00Z'
                updated_at: '2026-10-16T16:50:00Z'
        '201':
          description: Activity stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 67000000-0000-4000-8000-000000000002
                activity_name: Jardinagem
                started_at: '2026-10-16T16:00:00Z'
                duration_minutes: 45
                intensity: light
                total_steps: null
                avg_heart_rate_bpm: null
                calories_burned_kcal: null
                device_id: null
                idempotency_key: 2c1f7b9e-3d4a-4e5f-8a6b-7c8d9e0f1a2b
                created_at: '2026-10-16T16:50:00Z'
                updated_at: '2026-10-16T16:50:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'

  /v1/me/activities/batch:
    post:
      tags: [Activities]
      operationId: ingestActivities
      summary: Upload a batch of activities from a watch
      description: |
        Exercise sessions read from Health Connect. Same rules as
        `POST /v1/me/glucose-readings/batch`: up to 500 items, idempotent
        through `idempotency_key` (use the Health Connect session id), and
        partial acceptance. `device_id` is the watch the session came from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityBatch'
            example:
              activities:
                - idempotency_key: hc-exercise-7f3a91c2
                  activity_name: Caminhada
                  started_at: '2026-10-16T07:10:00Z'
                  duration_minutes: 35
                  intensity: moderate
                  total_steps: 4120
                  avg_heart_rate_bpm: 104
                  calories_burned_kcal: 180
                  device_id: 50000000-0000-4000-8000-000000000002
      responses:
        '200':
          description: Batch processed. The counts say what happened to each activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
              example:
                inserted: 1
                duplicates: 0
                rejected: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'

  /v1/me/activities/{activity_id}:
