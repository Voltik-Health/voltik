  /v1/me/glucose-readings/{reading_id}:
    patch:
      tags: [Glucose]
      operationId: updateGlucoseReading
      summary: Correct a manual reading
      description: |
        Only manual readings (`manual_fingerstick`) can be corrected. Readings
        from a sensor or a health platform answer 403 `reading_immutable`. An
        alert that the reading raised stays in the history.
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlucoseReadingUpdate'
            example:
              value_mg_dl: 124
      responses:
        '200':
          description: The reading after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseReading'
              example:
                id: 184260
                measured_at: '2026-10-16T12:55:00Z'
                value_mg_dl: 124
                trend: unknown
                source: manual_fingerstick
                device_id: null
                signal_quality: null
                idempotency_key: 0b6f3a52-7c1d-4e8a-9f20-6d4c3b2a1e0f
                created_at: '2026-10-16T12:55:20Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadingImmutable'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Glucose]
      operationId: deleteGlucoseReading
      summary: Delete a manual reading
      description: |
        The reading leaves the charts and the statistics. Only manual readings
        can be deleted; the others answer 403 `reading_immutable`.
      parameters:
        - $ref: '#/components/parameters/ReadingId'
      responses:
        '204':
