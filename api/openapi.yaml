    post:
      tags: [Glucose]
      operationId: createGlucoseReading
      summary: Log a manual glucose reading
      description: |
        A finger-prick reading typed by the patient. It is stored with `source`
        `manual_fingerstick` and no device. When the meter shows "LO" or "HI",
        send 20 or 550. A reading at or past the patient's critical limits
        raises an alert, like a sensor reading. Sending an `idempotency_key`
        that is already stored returns that reading (200) and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualGlucoseReadingCreate'
            example:
              idempotency_key: 0b6f3a52-7c1d-4e8a-9f20-6d4c3b2a1e0f
              measured_at: '2026-10-16T12:55:00Z'
              value_mg_dl: 142
      responses:
        '200':
          description: A reading with this `idempotency_key` was already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseReading'
              example:
                id: 184260
                measured_at: '2026-10-16T12:55:00Z'
                value_mg_dl: 142
                trend: unknown
                source: manual_fingerstick
                device_id: null
                signal_quality: null
                idempotency_key: 0b6f3a52-7c1d-4e8a-9f20-6d4c3b2a1e0f
                created_at: '2026-10-16T12:55:20Z'
        '201':
          description: Reading stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseReading'
              example:
                id: 184260
                measured_at: '2026-10-16T12:55:00Z'
                value_mg_dl: 142
                trend: unknown
                source: manual_fingerstick
                device_id: null
                signal_quality: null
                idempotency_key: 0b6f3a52-7c1d-4e8a-9f20-6d4c3b2a1e0f
