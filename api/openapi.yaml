  /v1/reports/{report_id}/pdf:
    get:
      tags: [Reports]
      operationId: exportReportPdf
      summary: Get a link to the report's PDF
      description: |
        Generates the PDF the first time (AGP chart, metrics and summary) and
        returns a link that works for 15 minutes without the `Authorization`
        header, for a PDF viewer or a download. The PDF identifies the patient.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: A temporary link to the PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileLink'
              example:
                url: https://voltik-cgm-staging.duckdns.org/v1/files/69000000-0000-4000-8000-000000000002?expires=1760610300&signature=7b3d1f9e5a2c
                expires_at: '2026-10-16T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/files/{file_id}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download a file through a signed link
      description: |
        Meal photos and report PDFs. Use the links the API returns (`image_url`,
        `GET /v1/reports/{report_id}/pdf`) as they are: `expires` and
        `signature` prove the link was issued by the API. After 15 minutes the
        link answers 403 `link_expired`; ask for the resource again to get a new
        one.
      security: []
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: expires
          in: query
          required: true
          description: When the link stops working, in seconds since 1970-01-01 UTC.
          schema:
            type: integer
            format: int64
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: The link is not valid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: link_expired
                message: This link has expired. Ask for a new one.
                details: []
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/sms:
    post:
      tags: [Webhooks]
      operationId: receiveSmsStatus
      summary: Delivery receipts from the SMS provider
      description: |
        Called by Twilio (status callbacks) for each escalation SMS. The API
        checks the `X-Twilio-Signature` header and answers 403 when it does not
        match. Not for the apps.
      security: []
      parameters:
        - name: X-Twilio-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmsStatusCallback'
      responses:
        '204':
          description: Receipt recorded.
        '403':
          description: The signature does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: forbidden
                message: Invalid signature.
                details: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Voltik session token returned by the `POST /v1/auth/...` sign-in endpoints, valid for 7 days.

  parameters:
    RangeFrom:
      name: from
      in: query
      required: true
      description: Start of the range, inclusive (RFC 3339).
      schema:
        type: string
        format: date-time
      example: '2026-10-16T00:00:00Z'
    RangeTo:
      name: to
      in: query
      required: true
      description: End of the range, exclusive (RFC 3339). Must be after `from`.
      schema:
        type: string
        format: date-time
      example: '2026-10-17T00:00:00Z'
    TimeSeriesLimit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    ListLimit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave it out to get the first page.
      schema:
        type: string
    ConsentTypePath:
      name: consent_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsentType'
    PushTokenId:
      name: push_token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReadingId:
      name: reading_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FoodId:
      name: food_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServingId:
      name: serving_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComponentId:
      name: component_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Barcode:
      name: ean
      in: path
      required: true
      description: EAN-13, EAN-8 or UPC code, digits only.
      schema:
        type: string
        pattern: '^[0-9]{8,14}$'
      example: '5601234567890'
    MealId:
      name: meal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InsulinLogId:
      name: insulin_log_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipientId:
      name: recipient_id
      in: path
      required: true
      description: The notification's row in the alert's `recipients`.
      schema:
        type: string
        format: uuid
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is malformed or breaks a rule. See `code` and `details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: The request is not valid.
            details: []
    Unauthenticated:
      description: The session token is missing, invalid or expired. Sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: The session token has expired.
            details: []
    NotFound:
      description: The resource does not exist or belongs to someone else.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found.
            details: []
    NoPatientProfile:
      description: The user has not completed patient onboarding (`POST /v1/me/patient`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: patient_profile_not_found
            message: Complete onboarding with POST /v1/me/patient first.
            details: []
    SignedIn:
      description: Signed in. Send `access_token` on every request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
          example:
            access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-payload.mock-signature
            token_type: Bearer
            expires_at: '2026-10-23T09:30:00Z'
            user:
              id: 20000000-0000-4000-8000-000000000001
              email: manuel.sousa@example.com
              full_name: Manuel Sousa
              phone: '+351912345678'
              profile_photo_url: https://lh3.googleusercontent.com/a/mock-photo
              account_status: active
              profile_types: [patient]
              created_at: '2026-10-01T08:12:00Z'
    InvalidProviderToken:
      description: The identity provider rejected the token (bad signature, expired or issued for another app).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_provider_token
            message: The token from the identity provider has expired.
            details: []
    SignInForbidden:
      description: The account cannot sign in. It is suspended, or waiting for deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            account_disabled:
              summary: Suspended account
              value:
                code: account_disabled
                message: This account is suspended.
                details: []
            account_pending_deletion:
              summary: Account waiting for deletion
              value:
                code: account_pending_deletion
                message: This account will be erased on 2026-11-15T09:30:00Z.
                details: []
    ProviderUnavailable:
      description: Sign-in with this identity provider is not available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: provider_unavailable
            message: Sign in with Apple is not available yet.
            details: []
    DocumentOutdated:
      description: A newer version of the legal document is in force. Show it and ask the user to accept it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: document_outdated
            message: Version 1.0 of terms_of_service is no longer in force.
            details: []
    EmailInUse:
      description: The email already has an account under another provider. Ask the user to sign in the same way as the first time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: email_in_use
            message: This email already has an account that signs in with another provider.
            details: []
    Forbidden:
      description: The user's profile does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Only platform admins can do this.
            details: []
    ConsentRequired:
      description: The patient has not accepted the consent this feature needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: consent_required
            message: Meal photos need the external_ai_processing consent.
            details: []
    ReadingImmutable:
      description: Only manual readings can be corrected or deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: reading_immutable
            message: Readings from sensors and health platforms cannot be changed.
            details: []
    InvalidState:
      description: The resource is not in a state that allows this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_state
            message: A cancelled meal cannot be marked as eaten.
            details: []
    CategoryNameTaken:
      description: A food category with this name already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: category_name_taken
            message: A category with this name already exists.
            details: []
    ServiceUnavailable:
      description: A service the request depends on is not available. Try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: service_unavailable
            message: Open Food Facts is not available.
            details: []

  schemas:
    # --- Shared -------------------------------------------------------------
    Error:
      type: object
      description: Body of every 4xx and 5xx response.
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Stable, machine-readable code. See the table in the API description.
        message:
          type: string
          description: Explanation for developers, in English. Do not show it to users.
        details:
          type: array
          description: Fields that failed validation. Empty when not applicable.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
          description: Name or path of the field in the request, e.g. `target_min_mg_dl` or `consents`.
        issue:
          type: string
          description: What is wrong with the field, in English.
    BatchResult:
      type: object
      description: Outcome of a batch upload. `inserted + duplicates + rejected` adds up to the batch size.
      required: [inserted, duplicates, rejected]
      properties:
        inserted:
          type: integer
          minimum: 0
          description: Items stored by this request.
        duplicates:
          type: integer
          minimum: 0
          description: Items whose `idempotency_key` was already stored. Nothing changed for them.
        rejected:
          type: array
          description: Items that will never be accepted. Do not send them again.
          items:
            $ref: '#/components/schemas/RejectedItem'
    RejectedItem:
      type: object
      required: [index, idempotency_key, code, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the item in the request, starting at 0.
        idempotency_key:
          type: [string, 'null']
          description: The item's key, if it had one.
        code:
          type: string
          description: '`validation_failed`, `unknown_device` or `measured_at_in_future`.'
        message:
          type: string
          description: Explanation for developers, in English.

    # --- System -------------------------------------------------------------
    Health:
      type: object
      required: [status, environment, version]
      properties:
        status:
          type: string
          enum: [ok]
        environment:
          type: string
          enum: [local, staging, production]
        version:
          type: string
          description: Git commit the API was built from (`dev` for local builds).

    # --- Auth and account ---------------------------------------------------
    GoogleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: |
            Google ID token (a JWT) obtained by the client. The API checks its
            signature, expiry and audience (the web and Android OAuth client IDs).
    MicrosoftSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: |
            Microsoft ID token (a JWT) obtained with MSAL. The API checks its
            signature, expiry and audience (the Voltik app registration).
    AppleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: |
            Apple identity token (a JWT). The API checks its signature, expiry and
            audience (the Voltik Services ID).
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          description: Send it on the first sign-in, the only time Apple shares the name. Ignored afterwards.
    FacebookSignInRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: |
            User access token from Facebook Login, granted with the `email`
            permission. The API checks it with the Graph API.
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          description: 'Voltik session token. Send it as `Authorization: Bearer <access_token>`.'
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: When the token stops working, 7 days after sign-in.
        user:
          $ref: '#/components/schemas/Me'
    Me:
      type: object
      required: [id, email, full_name, phone, profile_photo_url, account_status, profile_types, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          format: email
          description: |
            Verified email given by the identity provider, or `null` when the
            provider shared none. With Apple it may be a relay address.
        full_name:
          type: string
          maxLength: 150
        phone:
          type: [string, 'null']
          maxLength: 30
        profile_photo_url:
          type: [string, 'null']
          format: uri
          maxLength: 500
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        profile_types:
          type: array
          description: |
            Active profiles of the user, without repeats. Empty until onboarding is
            done. A user can have more than one, e.g. patient and caregiver.
          items:
            $ref: '#/components/schemas/ProfileType'
        created_at:
          type: string
          format: date-time
    MeUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: [string, 'null']
          maxLength: 30
          description: International format recommended, e.g. `+351912345678`. `null` removes it.
    AccountStatus:
      type: string
      enum: [active, suspended, pending, deactivated]
    ProfileType:
      type: string
      description: Which area of the apps the user can open.
      enum: [patient, caregiver, health_professional, company_manager, admin]

    # --- Consents -----------------------------------------------------------
    ConsentType:
      type: string
      description: |
        `terms_of_service` and `health_data_processing` are mandatory for patients.
        `external_ai_processing` is needed to use Iris.
      enum: [terms_of_service, health_data_processing, external_ai_processing, beta_testing]
    ConsentAcceptance:
      type: object
      required: [consent_type, document_version]
      properties:
        consent_type:
          $ref: '#/components/schemas/ConsentType'
        document_version:
          type: string
          minLength: 1
          maxLength: 20
          description: Version of the document the user read, e.g. `1.0`.
    Consent:
      type: object
      required: [consent_type, document_version, created_at, revoked_at]
      properties:
        consent_type:
          $ref: '#/components/schemas/ConsentType'
        document_version:
          type: string
        created_at:
          type: string
          format: date-time
          description: When the user accepted.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: When the user revoked it. `null` while it is active.
    ConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consent'

    # --- Push tokens --------------------------------------------------------
    PushPlatform:
      type: string
      enum: [android, ios, web]
    PushTokenRegistration:
      type: object
      required: [platform, push_token]
      properties:
        platform:
          $ref: '#/components/schemas/PushPlatform'
        push_token:
          type: string
          minLength: 1
          maxLength: 500
          description: Token given by FCM (Android and web) or APNs (iOS).
    PushToken:
      type: object
      required: [id, platform, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Use it to unregister the token on sign-out.
        platform:
          $ref: '#/components/schemas/PushPlatform'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # --- Patient ------------------------------------------------------------
    Gender:
      type: string
      enum: [male, female, other, undisclosed]
    DiabetesType:
      type: string
      enum: [type_1, type_2, gestational, lada, mody]
    Therapy:
      type: string
      enum: [multiple_daily_injections, insulin_pump, oral_medication, diet_only]
    PatientCreate:
      type: object
      required: [birth_date, diabetes_type, consents]
      properties:
        birth_date:
          type: string
          format: date
          description: Between 1900-01-01 and today.
        gender:
          $ref: '#/components/schemas/Gender'
        occupation:
          type: string
          maxLength: 100
        diabetes_type:
          $ref: '#/components/schemas/DiabetesType'
        current_therapy:
          $ref: '#/components/schemas/Therapy'
        target_min_mg_dl:
          type: integer
          minimum: 40
          maximum: 550
          default: 70
        target_max_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
          default: 180
        critical_low_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
          default: 55
        critical_high_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
          default: 250
        weight_kg:
          type: number
          format: double
          minimum: 2
          maximum: 500
        height_cm:
          type: integer
          minimum: 30
          maximum: 260
        weekly_reports_enabled:
          type: boolean
          description: Generate a report of the previous week every Monday morning. `true` when left out.
        consents:
          type: array
          minItems: 2
          description: Must include `terms_of_service` and `health_data_processing`.
          items:
            $ref: '#/components/schemas/ConsentAcceptance'
    PatientUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        birth_date:
          type: string
          format: date
          description: Between 1900-01-01 and today.
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        occupation:
          type: [string, 'null']
          maxLength: 100
        diabetes_type:
          $ref: '#/components/schemas/DiabetesType'
        current_therapy:
          anyOf:
            - $ref: '#/components/schemas/Therapy'
            - type: 'null'
        target_min_mg_dl:
          type: integer
          minimum: 40
          maximum: 550
        target_max_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
        critical_low_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
        critical_high_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
        weight_kg:
          type: [number, 'null']
          format: double
          minimum: 2
          maximum: 500
        height_cm:
          type: [integer, 'null']
          minimum: 30
          maximum: 260
        weekly_reports_enabled:
          type: boolean
          description: Generate a report of the previous week every Monday morning.
    Patient:
      type: object
      required:
        - id
        - birth_date
        - gender
        - occupation
        - diabetes_type
        - current_therapy
        - target_min_mg_dl
        - target_max_mg_dl
        - critical_low_mg_dl
        - critical_high_mg_dl
        - weight_kg
        - height_cm
        - weekly_reports_enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        birth_date:
          type: string
          format: date
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        occupation:
          type: [string, 'null']
        diabetes_type:
          $ref: '#/components/schemas/DiabetesType'
        current_therapy:
          anyOf:
            - $ref: '#/components/schemas/Therapy'
            - type: 'null'
        target_min_mg_dl:
          type: integer
          description: Lower end of the target range (time in range).
        target_max_mg_dl:
          type: integer
          description: Upper end of the target range.
        critical_low_mg_dl:
          type: integer
          description: At or below this value the API raises a `critical_low` alert.
        critical_high_mg_dl:
          type: integer
          description: At or above this value the API raises a `critical_high` alert.
        weight_kg:
          type: [number, 'null']
          format: double
        height_cm:
          type: [integer, 'null']
        weekly_reports_enabled:
          type: boolean
          description: Generate a report of the previous week every Monday morning.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # --- Glucose ------------------------------------------------------------
    GlucoseTrend:
      type: string
      description: |
        Direction and speed of change reported by the source. `unknown` when the
        source gives no trend, e.g. a finger-prick meter.
      enum: [rising_fast, rising, stable, falling, falling_fast, unknown]
    GlucoseSource:
      type: string
      description: |
        Where the reading came from. CGM simulator and Dexcom: `cgm_sensor`.
        Bluetooth meter: `manual_fingerstick`. Health Connect: `health_connect_sync`.
        HealthKit: `healthkit_sync`.
      enum: [cgm_sensor, manual_fingerstick, healthkit_sync, health_connect_sync]
    GlucoseReadingInput:
      type: object
      required: [idempotency_key, measured_at, value_mg_dl, source]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Unique key created on the phone for this reading: a UUID, or a
            device-unique id such as `<meter serial>-<sequence number>`. Keys are
            unique across all patients.
        measured_at:
          type: string
          format: date-time
          description: When the sensor or meter took the reading.
        value_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
        trend:
          $ref: '#/components/schemas/GlucoseTrend'
          description: Leave it out when unknown; the API stores `unknown`.
        source:
          $ref: '#/components/schemas/GlucoseSource'
        device_id:
          type: string
          format: uuid
          description: |
            The CGM sensor that took the reading, from `POST /v1/me/devices`.
            Only `cgm_sensor` readings have a device.
        signal_quality:
          type: integer
          minimum: 0
          maximum: 100
          description: Signal quality reported by the sensor, if any.
    GlucoseReadingBatch:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GlucoseReadingInput'
    GlucoseReading:
      type: object
      required: [id, measured_at, value_mg_dl, trend, source, device_id, signal_quality, idempotency_key, created_at]
      properties:
        id:
          type: integer
          format: int64
        measured_at:
          type: string
          format: date-time
        value_mg_dl:
          type: integer
        trend:
          $ref: '#/components/schemas/GlucoseTrend'
        source:
          $ref: '#/components/schemas/GlucoseSource'
        device_id:
          type: [string, 'null']
          format: uuid
        signal_quality:
          type: [integer, 'null']
        idempotency_key:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
          description: When the reading reached the server. Later than `measured_at` for readings sent from the offline queue.
    GlucoseReadingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GlucoseReading'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page. `null` on the last page.

    # --- Heart rate ---------------------------------------------------------
    HeartRateSampleInput:
      type: object
      required: [idempotency_key, measured_at, bpm, device_id]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique key created on the phone, e.g. the Health Connect record id plus the sample time.
        measured_at:
          type: string
          format: date-time
        bpm:
          type: integer
          minimum: 25
          maximum: 250
        device_id:
          type: string
          format: uuid
          description: The watch or band, from `POST /v1/me/devices`.
    HeartRateSampleBatch:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/HeartRateSampleInput'
    HeartRateSample:
      type: object
      required: [id, measured_at, bpm, device_id, created_at]
      properties:
        id:
          type: integer
          format: int64
        measured_at:
          type: string
          format: date-time
        bpm:
          type: integer
        device_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    HeartRateSamplePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HeartRateSample'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page. `null` on the last page.

    # --- Alerts -------------------------------------------------------------
    AlertType:
      type: string
      enum: [predicted_low, predicted_high, critical_low, critical_high, sensor_disconnected, sensor_expiring]
    AlertSeverity:
      type: string
      enum: [info, warning, critical]
    AlertAckStatus:
      type: string
      enum: [pending, acknowledged, resolved, dismissed]
    Alert:
      type: object
      required:
        - id
        - alert_type
        - severity
        - title
        - message
        - iris_suggested_action
        - triggered_at
        - ack_status
        - acknowledged_at
        - resolution_notes
        - source_reading_id
        - source_prediction_id
        - device_id
        - source_value_mg_dl
        - acknowledged_by
        - recipients
        - created_at
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          $ref: '#/components/schemas/AlertType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        title:
          type: string
          maxLength: 150
          description: Short text for the notification and the banner, in Portuguese.
        message:
          type: string
          description: Full text shown to the user, in Portuguese.
        iris_suggested_action:
          type: [string, 'null']
          description: What to do now, in Portuguese. Never an insulin dose.
        triggered_at:
          type: string
          format: date-time
          description: When the condition was detected.
        ack_status:
          $ref: '#/components/schemas/AlertAckStatus'
        acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: When the patient or a caregiver acknowledged it. Who did is kept per recipient (`alert_recipients`).
        resolution_notes:
          type: [string, 'null']
          maxLength: 255
        source_reading_id:
          type: [integer, 'null']
          format: int64
          description: The reading that raised the alert, for `critical_low` and `critical_high`.
        source_prediction_id:
          type: [integer, 'null']
          format: int64
          description: The prediction that raised the alert, for `predicted_low` and `predicted_high`.
        device_id:
          type: [string, 'null']
          format: uuid
          description: The sensor that raised the alert, for `sensor_disconnected` and `sensor_expiring`.
        source_value_mg_dl:
          type: [integer, 'null']
          description: Glucose of the reading or prediction that raised the alert.
        acknowledged_by:
          description: Who acknowledged or closed the alert first. `null` while it is pending.
          anyOf:
            - $ref: '#/components/schemas/AlertActor'
            - type: 'null'
        recipients:
          type: array
          description: Who was notified, by which channel, and how far each notification got.
          items:
            $ref: '#/components/schemas/AlertRecipient'
        created_at:
          type: string
          format: date-time
    AlertPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page. `null` on the last page.

    # --- Devices ------------------------------------------------------------
    DeviceType:
      type: string
      enum: [cgm_sensor, smartwatch, smartband, glucometer]
    DeviceConnectionStatus:
      type: string
      enum: [active, disconnected, warming_up, expired, replaced]
    DeviceCreate:
      type: object
      required: [device_type, brand_model]
      properties:
        device_type:
          $ref: '#/components/schemas/DeviceType'
        brand_model:
          type: string
          minLength: 1
          maxLength: 100
        serial_or_mac:
          type: string
          minLength: 1
          maxLength: 100
          description: Serial number or Bluetooth address. Registering the same value again returns the existing device.
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
        sensor_expires_at:
          type: string
          format: date-time
          description: End of life of a CGM sensor.
    Device:
      type: object
      required:
        - id
        - device_type
        - brand_model
        - serial_or_mac
        - connection_status
        - battery_percent
        - first_reading_at
        - sensor_expires_at
        - last_synced_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        device_type:
          $ref: '#/components/schemas/DeviceType'
        brand_model:
          type: string
        serial_or_mac:
          type: [string, 'null']
        connection_status:
          $ref: '#/components/schemas/DeviceConnectionStatus'
        battery_percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        first_reading_at:
          type: [string, 'null']
          format: date-time
        sensor_expires_at:
          type: [string, 'null']
          format: date-time
        last_synced_at:
          type: [string, 'null']
          format: date-time
          description: Last time data from this device reached the server.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    DeviceStatusUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed.
      properties:
        connection_status:
          type: string
          description: Whether the app can talk to the device now. The API sets `warming_up`, `expired` and `replaced` by itself.
          enum: [active, disconnected]
        battery_percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        last_reading_at:
          type: string
          format: date-time
          description: Time of the latest reading the app got from the device. Sets `first_reading_at` the first time.

    # --- Glucose: manual readings and long charts ---------------------------
    ManualGlucoseReadingCreate:
      type: object
      required: [idempotency_key, measured_at, value_mg_dl]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique key created on the phone, e.g. a UUID.
        measured_at:
          type: string
          format: date-time
          description: When the patient measured. Not in the future.
        value_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
    GlucoseReadingUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed.
      properties:
        measured_at:
          type: string
          format: date-time
        value_mg_dl:
          type: integer
          minimum: 20
          maximum: 550
    GlucoseResolution:
      type: string
      description: Length of each bucket. `15m` when left out.
      enum: [15m, 1h]
    GlucoseSeriesPoint:
      type: object
      required: [bucket_start, mean_mg_dl, min_mg_dl, max_mg_dl, readings_count]
      properties:
        bucket_start:
          type: string
          format: date-time
        mean_mg_dl:
          type: integer
        min_mg_dl:
          type: integer
        max_mg_dl:
          type: integer
        readings_count:
          type: integer
          minimum: 1
    GlucoseSeries:
      type: object
      required: [resolution, items]
      properties:
        resolution:
          $ref: '#/components/schemas/GlucoseResolution'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GlucoseSeriesPoint'

    # --- Notifications ------------------------------------------------------
    AlertChannel:
      type: string
      enum: [push, sms, email, in_app]
    AlertDeliveryStatus:
      type: string
      description: '`pending` → `sent` → `delivered` → `read` → `acknowledged`, or `failed`. It never goes back.'
      enum: [pending, sent, delivered, read, acknowledged, failed]
    AlertRecipient:
      type: object
      description: One person and one channel of an alert.
      required: [id, user_id, full_name, channel, delivery_status, sent_at, delivered_at, read_at, acknowledged_at]
      properties:
        id:
          type: string
          format: uuid
          description: The `recipient_id` for the receipt endpoints.
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        channel:
          $ref: '#/components/schemas/AlertChannel'
        delivery_status:
          $ref: '#/components/schemas/AlertDeliveryStatus'
        sent_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
        acknowledged_at:
          type: [string, 'null']
          format: date-time
    AlertActor:
      type: object
      required: [user_id, full_name]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
    AlertResolution:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]
        resolution_notes:
          type: [string, 'null']
          maxLength: 255
          description: What was done, in the patient's words.

    # --- Activities ---------------------------------------------------------
    ActivityIntensity:
      type: string
      enum: [light, moderate, vigorous]
    ActivityCreate:
      type: object
      required: [idempotency_key, activity_name, started_at, duration_minutes, intensity]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique key created on the phone, or the Health Connect session id.
        activity_name:
          type: string
          minLength: 1
          maxLength: 100
          description: E.g. "Caminhada". Free text, in the user's language.
        started_at:
          type: string
          format: date-time
          description: Not in the future.
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        intensity:
          $ref: '#/components/schemas/ActivityIntensity'
        total_steps:
          type: integer
          minimum: 0
          maximum: 200000
        avg_heart_rate_bpm:
          type: integer
          minimum: 30
          maximum: 250
        calories_burned_kcal:
          type: integer
          minimum: 0
          maximum: 15000
        device_id:
          type: string
          format: uuid
          description: The watch the session came from, from `POST /v1/me/devices`.
    ActivityBatch:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ActivityCreate'
    ActivityUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        activity_name:
          type: string
          minLength: 1
          maxLength: 100
        started_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        intensity:
          $ref: '#/components/schemas/ActivityIntensity'
        total_steps:
          type: [integer, 'null']
          minimum: 0
          maximum: 200000
        avg_heart_rate_bpm:
          type: [integer, 'null']
          minimum: 30
          maximum: 250
        calories_burned_kcal:
          type: [integer, 'null']
          minimum: 0
          maximum: 15000
    Activity:
      type: object
      required:
        - id
        - activity_name
        - started_at
        - duration_minutes
        - intensity
        - total_steps
        - avg_heart_rate_bpm
        - calories_burned_kcal
        - device_id
        - idempotency_key
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        activity_name:
          type: string
        started_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        intensity:
          $ref: '#/components/schemas/ActivityIntensity'
        total_steps:
          type: [integer, 'null']
        avg_heart_rate_bpm:
          type: [integer, 'null']
        calories_burned_kcal:
          type: [integer, 'null']
        device_id:
          type: [string, 'null']
          format: uuid
        idempotency_key:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    # --- Foods --------------------------------------------------------------
    FoodType:
      type: string
      description: A `composite_dish` is made of other foods, whose quantities can be adjusted in a meal.
      enum: [generic, brand, composite_dish]
    FoodDataSource:
      type: string
      description: |
        `insa`: Portuguese food composition table (INSA). `open_food_facts`: a
        packaged product found by barcode. `portuguese_traditional`: added by
        the Voltik team. `user_custom`: created by a user. `fatsecret` is not
        used.
      enum: [insa, open_food_facts, portuguese_traditional, user_custom, fatsecret]
    MetricUnit:
      type: string
      enum: [g, ml]
    FoodCategoryRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    FoodServing:
      type: object
      description: A portion of a food and its nutrition. Carbohydrates do not include fibre, as in European tables and labels.
      required:
        - id
        - serving_description
        - metric_amount
        - metric_unit
        - carbs_g
        - fiber_g
        - sugars_g
        - calories_kcal
        - protein_g
        - fat_g
        - saturated_fat_g
        - sodium_mg
      properties:
        id:
          type: string
          format: uuid
        serving_description:
          type: string
          description: E.g. "100 g" or "1 prato (300 g)".
        metric_amount:
          type: [number, 'null']
          format: double
          description: Weight or volume of the serving, in `metric_unit`.
        metric_unit:
          anyOf:
            - $ref: '#/components/schemas/MetricUnit'
            - type: 'null'
        carbs_g:
          type: number
          format: double
        fiber_g:
          type: [number, 'null']
          format: double
        sugars_g:
          type: [number, 'null']
          format: double
        calories_kcal:
          type: number
          format: double
        protein_g:
          type: number
          format: double
        fat_g:
          type: number
          format: double
        saturated_fat_g:
          type: [number, 'null']
          format: double
        sodium_mg:
          type: [number, 'null']
          format: double
    FoodComponent:
      type: object
      description: An ingredient of a composite dish.
      required: [id, component_food_id, food_name, default_quantity_g]
      properties:
        id:
          type: string
          format: uuid
        component_food_id:
          type: string
          format: uuid
        food_name:
          type: string
        default_quantity_g:
          type: number
          format: double
          description: The usual quantity in one plate.
    Food:
      type: object
      required:
        - id
        - food_name
        - brand
        - food_type
        - data_source
        - category
        - barcode_ean
        - is_verified
        - is_own
        - source_attribution
        - servings
        - components
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        food_name:
          type: string
        brand:
          type: [string, 'null']
        food_type:
          $ref: '#/components/schemas/FoodType'
        data_source:
          $ref: '#/components/schemas/FoodDataSource'
        category:
          anyOf:
            - $ref: '#/components/schemas/FoodCategoryRef'
            - type: 'null'
        barcode_ean:
          type: [string, 'null']
        is_verified:
          type: boolean
          description: Reviewed by the Voltik nutrition team.
        is_own:
          type: boolean
          description: Created by the signed-in user.
        source_attribution:
          type: [string, 'null']
          description: Show it wherever the food's values appear. The data licences require it.
        servings:
          type: array
          items:
            $ref: '#/components/schemas/FoodServing'
        components:
          type: array
          description: The ingredients of a composite dish made by the Voltik team. Empty for other foods, including the INSA dishes, which come with their values ready.
          items:
            $ref: '#/components/schemas/FoodComponent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FoodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Food'
    ServingInput:
      type: object
      required: [serving_description, carbs_g, calories_kcal]
      description: Sugars cannot exceed carbohydrates and saturated fat cannot exceed fat.
      properties:
        serving_description:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the food, e.g. "1 fatia (50 g)".
        metric_amount:
          type: number
          format: double
          minimum: 0.01
          maximum: 50000
        metric_unit:
          $ref: '#/components/schemas/MetricUnit'
        carbs_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        fiber_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        sugars_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        calories_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 9000
        protein_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        fat_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        saturated_fat_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        sodium_mg:
          type: number
          format: double
          minimum: 0
          maximum: 50000
    ServingUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        serving_description:
          type: string
          minLength: 1
          maxLength: 100
        metric_amount:
          type: [number, 'null']
          format: double
          minimum: 0.01
          maximum: 50000
        metric_unit:
          anyOf:
            - $ref: '#/components/schemas/MetricUnit'
            - type: 'null'
        carbs_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        fiber_g:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1000
        sugars_g:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1000
        calories_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 9000
        protein_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        fat_g:
          type: number
          format: double
          minimum: 0
          maximum: 1000
        saturated_fat_g:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1000
        sodium_mg:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 50000
    FoodCreate:
      type: object
      required: [food_name, servings]
      properties:
        food_name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          minLength: 1
          maxLength: 100
        food_type:
          type: string
          description: '`generic` when left out.'
          enum: [generic, brand]
        barcode_ean:
          type: string
          pattern: '^[0-9]{8,14}$'
        category_id:
          type: string
          format: uuid
          description: From `GET /v1/food-categories`.
        servings:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ServingInput'
    FoodCategory:
      type: object
      required: [id, name, food_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        food_count:
          type: integer
          minimum: 0
          description: Foods in the category that are visible in the search.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FoodCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FoodCategory'
    FoodCategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique.
    AdminFoodCreate:
      type: object
      required: [food_name, food_type]
      properties:
        food_name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          minLength: 1
          maxLength: 100
        food_type:
          $ref: '#/components/schemas/FoodType'
        barcode_ean:
          type: string
          pattern: '^[0-9]{8,14}$'
        category_id:
          type: string
          format: uuid
        servings:
          type: array
          maxItems: 20
          description: Needed for foods that are not composite dishes.
          items:
            $ref: '#/components/schemas/ServingInput'
    AdminFoodUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        food_name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        barcode_ean:
          type: [string, 'null']
          pattern: '^[0-9]{8,14}$'
        category_id:
          type: [string, 'null']
          format: uuid
    AdminFoodItem:
      type: object
      required: [food, usage_count]
      properties:
        food:
          $ref: '#/components/schemas/Food'
        usage_count:
          type: integer
          minimum: 0
          description: Meal items that use the food.
    AdminFoodPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminFoodItem'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page. `null` on the last page.
    FoodComponentCreate:
      type: object
      required: [component_food_id, default_quantity_g]
      properties:
        component_food_id:
          type: string
          format: uuid
        default_quantity_g:
          type: number
          format: double
          minimum: 0.01
          maximum: 10000

    # --- Meals --------------------------------------------------------------
    MealType:
      type: string
      enum: [breakfast, morning_snack, lunch, afternoon_snack, dinner, evening_snack, other]
    MealStatus:
      type: string
      enum: [planned, eaten, cancelled]
    MealItemInput:
      type: object
      required: [serving_id]
      properties:
        id:
          type: string
          format: uuid
          description: Only in `PUT /v1/me/meals/{meal_id}/items`, to keep an existing item.
        serving_id:
          type: string
          format: uuid
          description: A serving from the catalogue. Its food comes with it.
        serving_quantity:
          type: number
          format: double
          minimum: 0.01
          maximum: 100
          description: How many servings, e.g. 0.5. 1 when left out.
        is_eaten:
          type: boolean
          description: '`false` keeps the item but leaves it out of the totals, e.g. food left on the plate. `true` when left out.'
    MealItem:
      type: object
      required: [id, food_id, food_name, serving_id, serving_description, serving_quantity, carbs_g, calories_kcal, is_eaten, created_at]
      properties:
        id:
          type: string
          format: uuid
        food_id:
          type: string
          format: uuid
        food_name:
          type: string
        serving_id:
          type: string
          format: uuid
        serving_description:
          type: string
        serving_quantity:
          type: number
          format: double
        carbs_g:
          type: number
          format: double
          description: The serving's carbohydrates times the quantity, as they were when the item was logged.
        calories_kcal:
          type: number
          format: double
        is_eaten:
          type: boolean
        created_at:
          type: string
          format: date-time
    MealCreate:
      type: object
      required: [meal_type, status]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique key created on the phone. Recommended, so a resent meal is not stored twice.
        meal_type:
          $ref: '#/components/schemas/MealType'
        status:
          type: string
          enum: [planned, eaten]
        meal_date:
          type: string
          format: date
          description: Needed for planned meals. For eaten meals, the day of `eaten_at` when left out.
        planned_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Planned time in Portugal, `HH:MM`.
        eaten_at:
          type: string
          format: date-time
          description: Eaten meals only. Now when left out. Not in the future.
        notes:
          type: string
          maxLength: 1000
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MealItemInput'
        total_carbs_g:
          type: number
          format: double
          minimum: 0
          maximum: 2000
          description: Only for a meal without items.
        total_calories_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 15000
          description: Only for a meal without items.
    MealUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        meal_type:
          $ref: '#/components/schemas/MealType'
        meal_date:
          type: string
          format: date
        planned_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        eaten_at:
          type: string
          format: date-time
          description: Eaten meals only.
        notes:
          type: [string, 'null']
          maxLength: 1000
        total_carbs_g:
          type: number
          format: double
          minimum: 0
          maximum: 2000
          description: Only for a meal without items.
        total_calories_kcal:
          type: number
          format: double
          minimum: 0
          maximum: 15000
          description: Only for a meal without items.
    MealItemsReplace:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MealItemInput'
    MealEaten:
      type: object
      properties:
        eaten_at:
          type: string
          format: date-time
          description: Now when left out. Not in the future.
    Meal:
      type: object
      required:
        - id
        - meal_type
        - meal_date
        - planned_time
        - status
        - eaten_at
        - total_carbs_g
        - total_calories_kcal
        - postprandial_delta_mg_dl
        - notes
        - idempotency_key
        - items
        - photos
        - insulin_logs
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        meal_type:
          $ref: '#/components/schemas/MealType'
        meal_date:
          type: string
          format: date
        planned_time:
          type: [string, 'null']
          description: '`HH:MM`, in Portugal.'
        status:
          $ref: '#/components/schemas/MealStatus'
        eaten_at:
          type: [string, 'null']
          format: date-time
        total_carbs_g:
          type: number
          format: double
        total_calories_kcal:
          type: number
          format: double
        postprandial_delta_mg_dl:
          type: [integer, 'null']
          description: |
            The largest change of glucose in the 2 hours after the meal,
            compared with the start of the meal. Filled in about 2 hours after
            `eaten_at`, when there are enough readings.
        notes:
          type: [string, 'null']
        idempotency_key:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/MealItem'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/MealPhoto'
        insulin_logs:
          type: array
          description: Insulin doses linked to the meal.
          items:
            $ref: '#/components/schemas/InsulinLog'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MealList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Meal'
    MealPhotoStatus:
      type: string
      enum: [pending, completed, failed]
    MealPhotoProposedItem:
      type: object
      description: A food the model recognised, matched with the catalogue when possible.
      required: [name, estimated_weight_g, estimated_carbs_g, estimated_calories_kcal, food_id, serving_id, serving_quantity]
      properties:
        name:
          type: string
          description: What the model saw, in Portuguese.
        estimated_weight_g:
          type: [number, 'null']
          format: double
        estimated_carbs_g:
          type: [number, 'null']
          format: double
        estimated_calories_kcal:
          type: [number, 'null']
          format: double
        food_id:
          type: [string, 'null']
          format: uuid
          description: The closest food in the catalogue, if any.
        serving_id:
          type: [string, 'null']
          format: uuid
        serving_quantity:
          type: [number, 'null']
          format: double
          description: Servings of `serving_id` that match the estimated weight.
    MealPhoto:
      type: object
      required:
        - id
        - meal_id
        - analysis_status
        - image_url
        - image_url_expires_at
        - estimated_weight_g
        - estimated_carbs_g
        - estimated_calories_kcal
        - confidence_percent
        - low_confidence
        - proposed_items
        - analyzed_at
        - confirmed_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        meal_id:
          type: string
          format: uuid
        analysis_status:
          $ref: '#/components/schemas/MealPhotoStatus'
        image_url:
          type: string
          format: uri
          description: Signed link to the image, valid for 15 minutes.
        image_url_expires_at:
          type: string
          format: date-time
        estimated_weight_g:
          type: [number, 'null']
          format: double
        estimated_carbs_g:
          type: [number, 'null']
          format: double
        estimated_calories_kcal:
          type: [number, 'null']
          format: double
        confidence_percent:
          type: [number, 'null']
          format: double
        low_confidence:
          type: boolean
          description: Confidence below 60 %. Ask the patient to check each item.
        proposed_items:
          type: array
          items:
            $ref: '#/components/schemas/MealPhotoProposedItem'
        analyzed_at:
          type: [string, 'null']
          format: date-time
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: When the patient confirmed or rejected the proposal.
        created_at:
          type: string
          format: date-time
    MealPhotoUpload:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 5 MB, without EXIF data.
    MealPhotoConfirmation:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: The items to add to the meal, without `id`. Empty to reject the proposal.
          items:
            $ref: '#/components/schemas/MealItemInput'

    # --- Insulin ------------------------------------------------------------
    InsulinType:
      type: string
      enum: [rapid_bolus, ultra_rapid_bolus, basal, premixed]
    InsulinReason:
      type: string
      enum: [meal, correction, scheduled_basal, mixed]
    InsulinLogCreate:
      type: object
      required: [idempotency_key, insulin_type, dose_units, administered_at, reason]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
        insulin_type:
          $ref: '#/components/schemas/InsulinType'
        insulin_brand:
          type: string
          minLength: 1
          maxLength: 80
        dose_units:
          type: number
          format: double
          minimum: 0.1
          maximum: 100
          description: Units, with one decimal place.
        administered_at:
          type: string
          format: date-time
          description: Not in the future.
        reason:
          $ref: '#/components/schemas/InsulinReason'
        meal_id:
          type: string
          format: uuid
          description: One of the patient's meals.
        notes:
          type: string
          maxLength: 255
    InsulinLogUpdate:
      type: object
      minProperties: 1
      description: Only the fields sent are changed. `null` clears an optional field.
      properties:
        insulin_type:
          $ref: '#/components/schemas/InsulinType'
        insulin_brand:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
        dose_units:
          type: number
          format: double
          minimum: 0.1
          maximum: 100
        administered_at:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/InsulinReason'
        meal_id:
          type: [string, 'null']
          format: uuid
        notes:
          type: [string, 'null']
          maxLength: 255
    InsulinLog:
      type: object
      required:
        - id
        - insulin_type
        - insulin_brand
        - dose_units
        - administered_at
        - reason
        - meal_id
        - notes
        - idempotency_key
        - edited_after_24h
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        insulin_type:
          $ref: '#/components/schemas/InsulinType'
        insulin_brand:
          type: [string, 'null']
        dose_units:
          type: number
          format: double
        administered_at:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/InsulinReason'
        meal_id:
          type: [string, 'null']
          format: uuid
        notes:
          type: [string, 'null']
        idempotency_key:
          type: [string, 'null']
        edited_after_24h:
          type: boolean
          description: The dose was corrected more than 24 hours after it was taken.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InsulinDailyTotal:
      type: object
      required: [date, insulin_type, total_units, doses]
      properties:
        date:
          type: string
          format: date
        insulin_type:
          $ref: '#/components/schemas/InsulinType'
        total_units:
          type: number
          format: double
        doses:
          type: integer
          minimum: 1
    InsulinLogList:
      type: object
      required: [items, daily_totals]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InsulinLog'
        daily_totals:
          type: array
          description: One entry per day and insulin type that has doses.
          items:
            $ref: '#/components/schemas/InsulinDailyTotal'

    # --- Stats and reports --------------------------------------------------
    GlucoseStats:
      type: object
      required:
        - from
        - to
        - target_min_mg_dl
        - target_max_mg_dl
        - readings_count
        - coverage_percent
        - time_in_range_percent
        - time_below_range_percent
        - time_above_range_percent
        - mean_glucose_mg_dl
        - std_dev_mg_dl
        - coefficient_of_variation_percent
        - gmi_percent
        - hypo_episodes
        - hyper_episodes
        - active_minutes
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        target_min_mg_dl:
          type: integer
          description: The lower limit used for TIR, TBR and TAR (the patient's own).
        target_max_mg_dl:
          type: integer
        readings_count:
          type: integer
          minimum: 0
        coverage_percent:
          type: number
          format: double
          description: Share of 5-minute slots with a reading.
        time_in_range_percent:
          type: [number, 'null']
          format: double
        time_below_range_percent:
          type: [number, 'null']
          format: double
        time_above_range_percent:
          type: [number, 'null']
          format: double
        mean_glucose_mg_dl:
          type: [integer, 'null']
        std_dev_mg_dl:
          type: [number, 'null']
          format: double
        coefficient_of_variation_percent:
          type: [number, 'null']
          format: double
        gmi_percent:
          type: [number, 'null']
          format: double
          description: Glucose management indicator (estimated HbA1c).
        hypo_episodes:
          type: integer
          minimum: 0
        hyper_episodes:
          type: integer
          minimum: 0
        active_minutes:
          type: integer
          minimum: 0
          description: Minutes of physical activity that started in the period.
    ReportPeriodType:
      type: string
      enum: [day, week, month, custom]
    ReportGeneratedBy:
      type: string
      description: '`system_scheduled` is the weekly report that the API generates on Mondays.'
      enum: [patient, professional, system_scheduled]
    ReportCreate:
      type: object
      required: [period_type, start_date, end_date]
      properties:
        period_type:
          $ref: '#/components/schemas/ReportPeriodType'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: Inclusive. At most 90 days after `start_date` and not after today.
    ClinicalReport:
      type: object
      required:
        - id
        - period_type
        - start_date
        - end_date
        - generated_by_role
        - target_min_mg_dl
        - target_max_mg_dl
        - coverage_percent
        - low_coverage
        - time_in_range_percent
        - time_below_range_percent
        - time_above_range_percent
        - mean_glucose_mg_dl
        - std_dev_mg_dl
        - coefficient_of_variation_percent
        - gmi_percent
        - hypo_episodes
        - hyper_episodes
        - iris_summary
        - work_impact_analysis
        - created_at
      properties:
        id:
          type: string
          format: uuid
        period_type:
          $ref: '#/components/schemas/ReportPeriodType'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        generated_by_role:
          $ref: '#/components/schemas/ReportGeneratedBy'
        target_min_mg_dl:
          type: integer
          description: The target range when the report was generated.
        target_max_mg_dl:
          type: integer
        coverage_percent:
          type: number
          format: double
        low_coverage:
          type: boolean
          description: 'Coverage below 70 %. Show "dados insuficientes para conclusões clínicas".'
        time_in_range_percent:
          type: number
          format: double
        time_below_range_percent:
          type: number
          format: double
        time_above_range_percent:
          type: number
          format: double
        mean_glucose_mg_dl:
          type: integer
        std_dev_mg_dl:
          type: [number, 'null']
          format: double
        coefficient_of_variation_percent:
          type: [number, 'null']
          format: double
        gmi_percent:
          type: [number, 'null']
          format: double
        hypo_episodes:
          type: integer
        hyper_episodes:
          type: integer
        iris_summary:
          type: [string, 'null']
          description: Plain summary by Iris, in Portuguese. Never suggests doses or diagnoses.
        work_impact_analysis:
          type: [string, 'null']
          description: How glucose related to the working day, by Iris.
        created_at:
          type: string
          format: date-time
    ReportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClinicalReport'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page. `null` on the last page.
    FileLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Works without the `Authorization` header until `expires_at`.
        expires_at:
          type: string
          format: date-time

    # --- Webhooks -----------------------------------------------------------
    SmsStatusCallback:
      type: object
      description: The fields Voltik reads from a Twilio status callback.
      required: [MessageSid, MessageStatus]
      properties:
        MessageSid:
          type: string
        MessageStatus:
          type: string
          description: '`queued`, `sent`, `delivered`, `undelivered` or `failed`.'
        ErrorCode:
          type: string

    # --- Nightscout ---------------------------------------------------------
    NightscoutSecret:
      type: object
      required: [nightscout_url, api_secret, created_at]
      properties:
        nightscout_url:
          type: string
          format: uri
          description: The "Nightscout URL" to set in Juggluco or xDrip+.
        api_secret:
          type: string
          description: The "API secret" to set in the app. Shown only once.
        created_at:
          type: string
          format: date-time
    NightscoutEntry:
      type: object
      description: A Nightscout entry. Voltik reads `type`, `sgv`/`mbg`, `date` and `direction`.
      required: [type, date]
      properties:
        type:
          type: string
          description: '`sgv` (sensor) or `mbg` (finger-prick). Others are ignored.'
        sgv:
          type: integer
          description: Sensor glucose in mg/dL.
        mbg:
          type: integer
          description: Meter glucose in mg/dL.
        date:
          type: integer
          format: int64
          description: When the reading was taken, in milliseconds since 1970-01-01 UTC.
        dateString:
          type: string
        direction:
          type: string
          description: Trend arrow, e.g. `Flat`, `FortyFiveUp`, `SingleDown`, `DoubleUp`.
        device:
          type: string
    NightscoutStatus:
      type: object
      required: [status, name, version, serverTime, serverTimeEpoch, apiEnabled, careportalEnabled, settings]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
        version:
          type: string
        serverTime:
          type: string
        serverTimeEpoch:
          type: integer
          format: int64
        apiEnabled:
          type: boolean
        careportalEnabled:
          type: boolean
        settings:
          type: object
          required: [units]
          properties:
            units:
              type: string
              enum: [mg/dl]
