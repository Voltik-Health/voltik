        '404':
          $ref: '#/components/responses/NoPatientProfile'
    post:
      tags: [Meals]
      operationId: createMeal
      summary: Plan or log a meal
      description: |
        - `status: planned` plans a meal for later (`meal_date`, optionally
          `planned_time`). Confirm it later with `POST /v1/me/meals/{meal_id}/eaten`.
        - `status: eaten` logs a meal that was eaten at `eaten_at` (by default,
          now). `meal_date` defaults to that day.

        Each item is a serving of a food and a quantity. The API works out the
        carbohydrates and calories of each item from the catalogue and keeps
        them, so later changes to the catalogue do not change past meals. A
        meal without items can carry only `total_carbs_g` (and
        `total_calories_kcal`), for a food that is not in the catalogue.

        Sending an `idempotency_key` that is already stored returns that meal
        (200) and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealCreate'
            example:
              idempotency_key: 3a9c5e1f-2b4d-4c6e-8f0a-1b2c3d4e5f60
              meal_type: lunch
              status: eaten
              eaten_at: '2026-10-16T12:40:00Z'
              items:
                - serving_id: 62000000-0000-4000-8000-000000000002
                  serving_quantity: 1
                - serving_id: 62000000-0000-4000-8000-000000000007
                  serving_quantity: 1
      responses:
        '200':
          description: A meal with this `idempotency_key` was already stored.
          content:
