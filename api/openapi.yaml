    post:
      tags: [Insulin]
      operationId: createInsulinLog
      summary: Log an insulin dose
      description: |
        Records a dose the patient has already taken. Voltik never calculates or
        suggests doses. `meal_id` links the dose to one of the patient's meals.
        Sending an `idempotency_key` that is already stored returns that dose
        (200): a dose sent twice is never stored twice. Ask for confirmation in
        the app before sending more than 30 units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsulinLogCreate'
            example:
              idempotency_key: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
              insulin_type: rapid_bolus
              insulin_brand: NovoRapid
              dose_units: 4
              administered_at: '2026-10-16T12:35:00Z'
              reason: meal
              meal_id: 63000000-0000-4000-8000-000000000001
      responses:
