openapi: 3.1.0
info:
  title: Voltik API
  version: 0.3.0
  summary: REST contract between the Voltik apps and the Go API.
  description: |
    Contract between the Voltik clients (Android app and web portal) and the Go API.
    The apps are built against the mock server, which answers with the examples in
    this file, and the backend implements the same contract. `api/README.md`
    explains how to run the mock server and the linter.

    This version covers group 1 of DVT-76 (base) and the health data of DVT-79:
    devices, readings, the food diary, insulin, activity, history, reports and
    alerts. The care team and group 3 (Iris, telemedicine, Dexcom) are added in
    later pull requests, before the tickets that use them start.

    ## Conventions

    - **Authentication.** Users sign in with Google, Microsoft, Apple or
      Facebook, one `POST /v1/auth/...` endpoint per provider. All four return
      the same Voltik session token, valid for 7 days. Every other endpoint
      except `GET /v1/health` needs `Authorization: Bearer <token>`. There is no
      refresh token: on a 401, get a new token from the same provider and sign
      in again. Signing out happens on the client: forget the token and
      unregister the push token. The API checks the account on every request:
      the token of a deleted account answers 401 `unauthenticated` and the token
      of a suspended account answers 403 `account_disabled`.
    - **One email, one account.** Signing in with a provider whose email
      already has an account under another provider answers 409
      `email_in_use`: the user must sign in the same way as the first time.
      The API only keeps emails that the provider has verified. A provider that
      shares no verified email creates the account without one (`email: null`).
    - **Field names** follow the database (`value_mg_dl`, `measured_at`,
      `idempotency_key`, ...). Responses always include every field, and a field
      without a value is `null`. In `PATCH` requests, leave a field out to keep
      it and send `null` to clear it.
    - **Times.** Instants are RFC 3339 in UTC, e.g. `2026-10-16T09:30:00Z`.
      Calendar dates are `YYYY-MM-DD`. Glucose is always in mg/dL.
    - **Lists** are always an object with `items`, never a bare array. Paginated
      lists also return `next_cursor` (`null` on the last page) and accept
      `limit` and `cursor`: send `next_cursor` back as `cursor` to get the next
      page.
    - **Errors** have the shape `{code, message, details}`. Clients branch on
      `code`, a stable snake_case string, and show their own translated text.
      `message` is in English and meant for developers. `details` lists the
      fields that failed and is empty otherwise. New codes may be added, so
      treat an unknown code as a generic error.
    - **Patient data.** Endpoints under `/v1/me/` that read or write health data
      answer 404 `patient_profile_not_found` until the user completes onboarding
      with `POST /v1/me/patient`.
    - **Latest values.** The `.../latest` endpoints answer 204 (no body) while
      there is no data yet.
    - **Idempotent creates.** Endpoints that create health records take an
      `idempotency_key` made on the phone. Sending a key that is already stored
      returns the stored record (200) instead of creating another one (201).
    - **Deleted health records** leave the apps, the charts and the statistics.
    - **Days** (`date`, `meal_date`, `start_date`, ...) are calendar days in
      Portugal (Europe/Lisbon).
    - **Demo sensor.** In staging, a CGM sensor registered with `brand_model`
      `Voltik CGM simulator` gets a simulated reading every 5 minutes, after
      the last 30 days of history are filled in.

    ## Push notifications

    Alerts and finished background work arrive as FCM data messages. Every
    message has a `type`, and the other keys depend on it:

    | `type` | Other keys | When |
    | --- | --- | --- |
    | `alert` | `alert_id`, `recipient_id`, `alert_type`, `severity`, `title`, `body` | An alert was raised for the patient, or for a patient the caregiver follows. Report it with `POST /v1/me/notifications/{recipient_id}/delivered`, and with `.../read` when it is opened. |
    | `alert_closed` | `alert_id`, `ack_status` | Someone acknowledged or closed the alert: hide it. |
    | `meal_photo_analyzed` | `meal_id`, `photo_id`, `analysis_status` | The analysis of a meal photo finished. |
    | `report_ready` | `report_id` | The weekly report is ready. |

    ## Files

    Meal photos and report PDFs are served by `GET /v1/files/{file_id}`
    through signed links that the API puts in its responses. A link works for
    15 minutes without the `Authorization` header, so an image loader or a PDF
    viewer can open it. Ask for the resource again to get a new link.

    ## Error codes

    | Status | `code` | When |
    | --- | --- | --- |
    | 400 | `invalid_request` | Malformed JSON, wrong types or missing parameters |
    | 400 | `validation_failed` | One or more fields break a rule (see `details`) |
    | 401 | `unauthenticated` | Session token missing, invalid or expired |
    | 401 | `invalid_provider_token` | The identity provider rejected the token |
    | 403 | `account_disabled` | The account is suspended or deactivated |
    | 403 | `account_pending_deletion` | The account is waiting for deletion and cannot sign in |
    | 403 | `forbidden` | The user's profile does not allow this action |
    | 403 | `consent_required` | The patient has not accepted the consent the feature needs (`external_ai_processing` for meal photos) |
    | 403 | `reading_immutable` | Only manual readings can be corrected or deleted |
    | 403 | `link_expired` | The signed file link is not valid or has expired |
    | 404 | `not_found` | The resource does not exist or belongs to someone else |
    | 404 | `patient_profile_not_found` | Patient onboarding not completed |
    | 409 | `email_in_use` | The email already has an account under another provider |
    | 409 | `patient_profile_exists` | Patient onboarding already completed |
    | 409 | `mandatory_consent` | Mandatory consents cannot be revoked |
    | 409 | `document_outdated` | A newer version of the legal document is in force |
    | 409 | `professional_has_patients` | A clinician with active follow-ups cannot delete the account |
    | 409 | `invalid_state` | The resource is not in a state that allows the action, e.g. eating a cancelled meal |
    | 409 | `active_sensor_exists` | The patient already has a CGM sensor in use: replace it instead |
    | 409 | `barcode_in_use` | Another food already has this barcode |
    | 409 | `category_name_taken` | A food category with this name already exists |
    | 409 | `component_exists` | The ingredient is already part of the dish |
    | 409 | `no_readings` | The period has no glucose readings |
    | 409 | `analysis_not_ready` | The analysis of the photo has not finished |
    | 413 | `payload_too_large` | The uploaded file is too large |
    | 415 | `unsupported_media_type` | The uploaded file type is not accepted |
    | 429 | `rate_limited` | Too many requests; retry after the `Retry-After` header |
    | 500 | `internal_error` | Unexpected server error |
    | 503 | `service_unavailable` | The database or another dependency is down |
    | 503 | `provider_unavailable` | Sign-in with this identity provider is not available |

servers:
  - url: https://voltik-cgm.duckdns.org
    description: Production environment (Oracle Cloud)
  - url: https://voltik-cgm-staging.duckdns.org
    description: Staging environment (Oracle Cloud)
  - url: http://localhost:4010
    description: Prism mock server (see api/README.md)
  - url: http://localhost:8080
    description: Go API running on your machine

security:
  - bearerAuth: []

tags:
  - name: System
    description: Service status.
  - name: Auth
    description: Sign-in with Google, Microsoft, Apple or Facebook. Voltik never stores passwords.
  - name: Account
    description: The signed-in user, whatever their profile type.
  - name: Consents
    description: GDPR consents the user has accepted or revoked.
  - name: Push tokens
    description: Phones and browsers that receive push notifications (FCM on Android and web, APNs on iOS).
  - name: Patient
    description: Patient profile, created during onboarding.
  - name: Glucose
    description: Glucose readings from CGM sensors, meters and health platforms.
  - name: Heart rate
    description: Heart rate samples from watches and bands.
  - name: Alerts
    description: Glucose and sensor alerts raised for the patient.
  - name: Devices
    description: Sensors, meters, watches and bands linked to the patient.
  - name: Activities
    description: Physical activity, typed by the patient or imported from watches.
  - name: Foods
    description: The food catalogue. It has the Portuguese food composition table (INSA), packaged products found by barcode (Open Food Facts) and foods created by users.
  - name: Meals
    description: The food diary, with planned and eaten meals, their items and photos.
  - name: Insulin
    description: Insulin doses the patient took. Voltik never calculates or suggests doses.
  - name: Stats
    description: Glucose metrics for a period, such as time in range, mean, variability, GMI and episodes.
  - name: Reports
    description: Saved clinical reports and their PDF.
  - name: Notifications
    description: Delivery and read receipts of alert notifications.
  - name: Food catalogue
    description: Managing the food catalogue, for platform admins and nutrition professionals.
  - name: Files
    description: Meal photos and report PDFs, through signed links.
  - name: Webhooks
    description: Calls from external providers. Not for the apps.
  - name: Integrations
    description: Uploads from other apps (Juggluco, xDrip+) through the Nightscout API. Not for the Voltik apps.

paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check that the API is up
      description: Public. Used by the deployment pipeline and by monitoring.
      security: []
      responses:
        '200':
          description: The API and its database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                environment: staging
                version: cbae46e
        '503':
          description: The API is running but cannot reach the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The database is not reachable.
                details: []

  /v1/auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: Sign in with Google
      description: |
        The client gets an ID token from Google (Credential Manager on Android,
        Google Identity Services on the web) and exchanges it here for a Voltik
        session token.

        Rules shared by the four sign-in endpoints:
        - The first sign-in creates the user. While `profile_types` is empty,
          the app shows the onboarding choice.
        - An email belongs to one account. If it already has an account under
          another provider, the API answers 409 `email_in_use`.
        - If the provider does not share a verified email address, the account
          is created without one (`email: null`).
        - A suspended account answers 403 `account_disabled`. An account waiting
          for deletion (`DELETE /v1/me`) answers 403 `account_pending_deletion`
          until it is erased, 30 days after the request.
        - A provider that Voltik has not enabled answers 503
          `provider_unavailable`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
            example:
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Im1vY2sifQ.mock-google-payload.mock-signature
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidProviderToken'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '409':
          $ref: '#/components/responses/EmailInUse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/auth/microsoft:
    post:
      tags: [Auth]
      operationId: signInWithMicrosoft
      summary: Sign in with Microsoft
      description: |
        The client signs in with MSAL (personal or work Microsoft account) and
        exchanges the ID token here for a Voltik session token. Same rules as
        `POST /v1/auth/google`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicrosoftSignInRequest'
            example:
              id_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6Im1vY2sifQ.mock-microsoft-payload.mock-signature
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidProviderToken'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '409':
          $ref: '#/components/responses/EmailInUse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/auth/apple:
    post:
      tags: [Auth]
      operationId: signInWithApple
      summary: Sign in with Apple
      description: |
        The client signs in with Sign in with Apple (Sign in with Apple JS on the
        web, a web sign-in inside the app on Android) and exchanges the identity
        token here for a Voltik session token. Same rules as
        `POST /v1/auth/google`.

        Apple shares the user's name only on the first sign-in, and not inside
        the token, so send `full_name` that time. The email may be an Apple relay
        address (`...@privaterelay.appleid.com`).

        Not available yet: it answers 503 `provider_unavailable` until Voltik
        joins the Apple Developer Program.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
            example:
              id_token: eyJraWQiOiJtb2NrIiwiYWxnIjoiUlMyNTYifQ.mock-apple-payload.mock-signature
              full_name: Manuel Sousa
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidProviderToken'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '409':
          $ref: '#/components/responses/EmailInUse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/auth/facebook:
    post:
      tags: [Auth]
      operationId: signInWithFacebook
      summary: Sign in with Facebook
      description: |
        The client signs in with Facebook Login and sends the user access token,
        because on Android and the web Facebook gives no ID token. The API checks
        the token with the Graph API and asks Facebook for the name and email.
        Same rules as `POST /v1/auth/google`. A Facebook account that does not
        share its email is created without one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookSignInRequest'
            example:
              access_token: EAAmockFacebookUserAccessToken
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidProviderToken'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '409':
          $ref: '#/components/responses/EmailInUse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user
      description: |
        `profile_types` tells the app which area to open: patient, caregiver or
        clinician. An empty list means onboarding is not done yet.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 20000000-0000-4000-8000-000000000001
                email: manuel.sousa@example.com
                full_name: Manuel Sousa
                phone: '+351912345678'
                profile_photo_url: https://lh3.googleusercontent.com/a/mock-photo
                account_status: active
                profile_types: [patient]
                created_at: '2026-10-01T08:12:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update the signed-in user's name or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
            example:
              phone: '+351912345678'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 20000000-0000-4000-8000-000000000001
                email: manuel.sousa@example.com
                full_name: Manuel Sousa
                phone: '+351912345678'
                profile_photo_url: https://lh3.googleusercontent.com/a/mock-photo
                account_status: active
                profile_types: [patient]
                created_at: '2026-10-01T08:12:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Delete the account
      description: |
        Starts the GDPR erasure. Takes effect immediately: the account and the
        patient profile are deactivated, the session token stops working, push
        notifications stop and the subscriptions the user pays stop renewing.
        Signing in during the next 30 days answers 403 `account_pending_deletion`.
        After 30 days a daily job erases the account and everything that belongs
        to it, health data included. The audit log keeps its rows without the
        person.

        A clinician with active follow-ups gets 409 `professional_has_patients`:
        the Voltik administration ends the follow-ups first.
      responses:
        '204':
          description: Account deactivated. It is erased 30 days from now.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The user is a clinician with active follow-ups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: professional_has_patients
                message: End the active follow-ups before deleting this account.
                details: []

  /v1/me/consents:
    get:
      tags: [Consents]
      operationId: listConsents
      summary: List the user's consents
      description: Every consent the user accepted, newest first, including revoked ones.
      responses:
        '200':
          description: The user's consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
              example:
                items:
                  - consent_type: external_ai_processing
                    document_version: '1.0'
                    created_at: '2026-10-02T18:40:00Z'
                    revoked_at: null
                  - consent_type: health_data_processing
                    document_version: '1.0'
                    created_at: '2026-10-01T08:15:00Z'
                    revoked_at: null
                  - consent_type: terms_of_service
                    document_version: '1.0'
                    created_at: '2026-10-01T08:15:00Z'
                    revoked_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Consents]
      operationId: acceptConsent
      summary: Accept a consent
      description: |
        Records that the user accepted a version of a consent document, with the
        time and the IP address. Only the version in force can be accepted: an
        older version answers 409 `document_outdated`. Accepting a version that
        is already active returns it unchanged (200). Accepting a version that
        was revoked activates it again (201). Patients accept
        `terms_of_service` and `health_data_processing` during onboarding
        (`POST /v1/me/patient`). Iris asks for `external_ai_processing` on first use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentAcceptance'
            example:
              consent_type: external_ai_processing
              document_version: '1.0'
      responses:
        '200':
          description: This version was already accepted. Nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
              example:
                consent_type: external_ai_processing
                document_version: '1.0'
                created_at: '2026-10-02T18:40:00Z'
                revoked_at: null
        '201':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
              example:
                consent_type: external_ai_processing
                document_version: '1.0'
                created_at: '2026-10-16T10:05:00Z'
                revoked_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/DocumentOutdated'

  /v1/me/consents/{consent_type}:
    delete:
      tags: [Consents]
      operationId: revokeConsent
      summary: Revoke a consent
      description: |
        Revokes the active consent of this type. `terms_of_service` and
        `health_data_processing` cannot be revoked (409): the app offers to delete
        the account instead.
      parameters:
        - $ref: '#/components/parameters/ConsentTypePath'
      responses:
        '204':
          description: Consent revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Mandatory consents cannot be revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: mandatory_consent
                message: health_data_processing cannot be revoked. Delete the account instead.
                details: []

  /v1/me/push-tokens:
    post:
      tags: [Push tokens]
      operationId: registerPushToken
      summary: Register this device for push notifications
      description: |
        Call it after sign-in and whenever FCM or APNs gives the app a new token.
        A token that is already registered is returned as it is (200). If it
        belonged to another user of the same phone, it moves to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegistration'
            example:
              platform: android
              push_token: fcm-mock-token-dGVzdC1kZXZpY2UtMDE
      responses:
        '200':
          description: The token was already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
              example:
                id: 90000000-0000-4000-8000-000000000001
                platform: android
                is_active: true
                created_at: '2026-10-01T08:16:00Z'
                updated_at: '2026-10-16T09:00:00Z'
        '201':
          description: Token registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
              example:
                id: 90000000-0000-4000-8000-000000000001
                platform: android
                is_active: true
                created_at: '2026-10-16T09:00:00Z'
                updated_at: '2026-10-16T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/push-tokens/{push_token_id}:
    delete:
      tags: [Push tokens]
      operationId: unregisterPushToken
      summary: Stop push notifications on this device
      description: Call it on sign-out.
      parameters:
        - $ref: '#/components/parameters/PushTokenId'
      responses:
        '204':
          description: The device no longer receives push notifications.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/patient:
    post:
      tags: [Patient]
      operationId: createPatientProfile
      summary: Complete patient onboarding
      description: |
        Creates the patient profile and records the consents in one step.
        `consents` must include `terms_of_service` and `health_data_processing`,
        each in the version in force. Thresholds that are left out take the
        defaults: target 70–180 mg/dL, critical 55 and 250 mg/dL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
            example:
              birth_date: '1968-03-02'
              occupation: Metalworker
              diabetes_type: type_1
              current_therapy: multiple_daily_injections
              consents:
                - consent_type: terms_of_service
                  document_version: '1.0'
                - consent_type: health_data_processing
                  document_version: '1.0'
      responses:
        '201':
          description: Patient profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              example:
                id: 30000000-0000-4000-8000-000000000001
                birth_date: '1968-03-02'
                gender: null
                occupation: Metalworker
                diabetes_type: type_1
                current_therapy: multiple_daily_injections
                target_min_mg_dl: 70
                target_max_mg_dl: 180
                critical_low_mg_dl: 55
                critical_high_mg_dl: 250
                weight_kg: null
                height_cm: null
                weekly_reports_enabled: true
                created_at: '2026-10-01T08:15:00Z'
                updated_at: '2026-10-01T08:15:00Z'
        '400':
          description: A field is not valid or a mandatory consent is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: validation_failed
                message: Some fields are not valid.
                details:
                  - field: consents
                    issue: must include health_data_processing
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The user already has a patient profile, or a consent is not in the version in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                patient_profile_exists:
                  summary: Onboarding already completed
                  value:
                    code: patient_profile_exists
                    message: This user already has a patient profile.
                    details: []
                document_outdated:
                  summary: A consent is not in the version in force
                  value:
                    code: document_outdated
                    message: Version 1.0 of terms_of_service is no longer in force.
                    details: []
    get:
      tags: [Patient]
      operationId: getPatientProfile
      summary: Get the patient profile
      responses:
        '200':
          description: The patient profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              example:
                id: 30000000-0000-4000-8000-000000000001
                birth_date: '1968-03-02'
                gender: null
                occupation: Metalworker
                diabetes_type: type_1
                current_therapy: multiple_daily_injections
                target_min_mg_dl: 70
                target_max_mg_dl: 180
                critical_low_mg_dl: 55
                critical_high_mg_dl: 250
                weight_kg: 82.5
                height_cm: 174
                weekly_reports_enabled: true
                created_at: '2026-10-01T08:15:00Z'
                updated_at: '2026-10-03T19:02:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'
    patch:
      tags: [Patient]
      operationId: updatePatientProfile
      summary: Update the patient profile
      description: |
        Changes only the fields sent. After the change, the thresholds must keep
        the order `critical_low_mg_dl < target_min_mg_dl < target_max_mg_dl <
        critical_high_mg_dl`. Otherwise the API answers 400 and lists the fields
        involved in `details`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
            example:
              target_min_mg_dl: 80
              weight_kg: 81.5
      responses:
        '200':
          description: The updated patient profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              example:
                id: 30000000-0000-4000-8000-000000000001
                birth_date: '1968-03-02'
                gender: null
                occupation: Metalworker
                diabetes_type: type_1
                current_therapy: multiple_daily_injections
                target_min_mg_dl: 80
                target_max_mg_dl: 180
                critical_low_mg_dl: 55
                critical_high_mg_dl: 250
                weight_kg: 81.5
                height_cm: 174
                weekly_reports_enabled: true
                created_at: '2026-10-01T08:15:00Z'
                updated_at: '2026-10-16T10:12:00Z'
        '400':
          description: A field is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: validation_failed
                message: Some fields are not valid.
                details:
                  - field: target_min_mg_dl
                    issue: must be lower than target_max_mg_dl
                  - field: target_max_mg_dl
                    issue: must be higher than target_min_mg_dl
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NoPatientProfile'

