      summary: Create a food
      description: |
        Adds a food that is missing from the catalogue (`data_source`
        `user_custom`, not verified). Only the author sees it until a reviewer
        verifies it. Every serving needs carbohydrates and calories. Sugars
        cannot exceed carbohydrates and saturated fat cannot exceed fat. Fibre
        is not limited, because European tables and labels do not count it in
        the carbohydrates.

