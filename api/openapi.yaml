                    meal_id: 63000000-0000-4000-8000-000000000002
                    analysis_status: completed
                    image_url: https://voltik-cgm-staging.duckdns.org/v1/files/69000000-0000-4000-8000-000000000001?expires=1760620600&signature=1c3e5a7b9d0f
                    image_url_expires_at: '2026-10-15T20:27:00Z'
                    estimated_weight_g: 420
                    estimated_carbs_g: 27.3
                    estimated_calories_kcal: 1046
                    confidence_percent: 72
                    low_confidence: false
                    proposed_items:
                      - name: Francesinha
                        estimated_weight_g: 420
                        estimated_carbs_g: 27.3
                        estimated_calories_kcal: 1046
                        food_id: 61000000-0000-4000-8000-000000000007
                        serving_id: 62000000-0000-4000-8000-000000000011
