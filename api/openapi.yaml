              example:
                resolution: 15m
                items:
                  - bucket_start: '2026-10-16T09:00:00Z'
                    mean_mg_dl: 131
                    min_mg_dl: 126
                    max_mg_dl: 137
                    readings_count: 3
                  - bucket_start: '2026-10-16T09:15:00Z'
