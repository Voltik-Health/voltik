  /v1/me/meals:
    get:
      tags: [Meals]
      operationId: listMeals
      summary: List the meals of a day or a range of days
      description: |
        Send `date` for the Diário of one day, or `from_date` and `to_date` for a
        chart (at most 90 days). Days are calendar days in Portugal. Meals come
        by day, then by meal type, then by time, with their items, photos,
        linked insulin doses and the impact on glucose.
      parameters:
        - name: date
          in: query
          description: One day.
          schema:
            type: string
            format: date
          example: '2026-10-16'
        - name: from_date
          in: query
          description: First day of the range, inclusive.
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: Last day of the range, inclusive.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The meals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealList'
              example:
                items:
                  - id: 63000000-0000-4000-8000-000000000001
                    meal_type: lunch
                    meal_date: '2026-10-16'
                    planned_time: null
                    status: eaten
                    eaten_at: '2026-10-16T12:40:00Z'
                    total_carbs_g: 36.65
                    total_calories_kcal: 539
                    postprandial_delta_mg_dl: 48
                    notes: null
                    idempotency_key: 3a9c5e1f-2b4d-4c6e-8f0a-1b2c3d4e5f60
                    items:
                      - id: 64000000-0000-4000-8000-000000000001
                        food_id: 61000000-0000-4000-8000-000000000001
                        food_name: Sopa, caldo verde
                        serving_id: 62000000-0000-4000-8000-000000000002
                        serving_description: 1 prato (300 g)
                        serving_quantity: 1
                        carbs_g: 15.9
                        calories_kcal: 129
                        is_eaten: true
                        created_at: '2026-10-16T12:41:00Z'
                      - id: 64000000-0000-4000-8000-000000000002
                        food_id: 61000000-0000-4000-8000-000000000006
                        food_name: Bacalhau à Brás
                        serving_id: 62000000-0000-4000-8000-000000000007
                        serving_description: 1 prato (250 g)
                        serving_quantity: 1
                        carbs_g: 20.75
                        calories_kcal: 410
                        is_eaten: true
                        created_at: '2026-10-16T12:41:00Z'
                    photos: []
                    insulin_logs:
                      - id: 66000000-0000-4000-8000-000000000001
                        insulin_type: rapid_bolus
                        insulin_brand: NovoRapid
                        dose_units: 4
                        administered_at: '2026-10-16T12:35:00Z'
                        reason: meal
                        meal_id: 63000000-0000-4000-8000-000000000001
                        notes: null
                        idempotency_key: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                        edited_after_24h: false
                        created_at: '2026-10-16T12:42:00Z'
                        updated_at: '2026-10-16T12:42:00Z'
                    created_at: '2026-10-16T12:41:00Z'
