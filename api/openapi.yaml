  /v1/foods:
    get:
      tags: [Foods]
      operationId: searchFoods
      summary: Search the food catalogue
      description: |
        Matches food names ignoring accents and case, so "pao" finds "Pão".
        Verified foods and composite dishes come first. The catalogue has the
        Portuguese food composition table (INSA), the packaged products already
        found by barcode, and the foods created by users. A food a user created
        is visible only to them until a reviewer verifies it.

        Show each food's `source_attribution` where its values appear: the
        licences of the INSA table and of Open Food Facts require it.
      parameters:
        - name: q
          in: query
          required: true
          description: At least 2 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: caldo verde
        - name: limit
          in: query
          description: Maximum number of results.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: The best matches.
          content:
            application/json:
              schema:
