  /v1/me/meals/{meal_id}/photos:
    post:
      tags: [Meals]
      operationId: uploadMealPhoto
      summary: Add a photo of the meal for analysis
      description: |
        Needs the `external_ai_processing` consent; without it the API answers
        403 `consent_required`. Remove the EXIF data (location, date, phone) and
        shrink the image to at most 1600 px before sending it: JPEG, PNG or
        WebP, up to 5 MB.

        The API answers 202 at once. An AI model then estimates the foods,
        weights, carbohydrates and calories, usually within a few seconds. A
        push (`type` `meal_photo_analyzed`) says when it is done, or poll
        `GET /v1/me/meals/{meal_id}/photos/{photo_id}`. The estimate is only a
        proposal: nothing counts until the patient confirms it. A second photo
        of the same meal (a second helping) adds to the first.
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MealPhotoUpload'
      responses:
        '202':
          description: Photo stored; the analysis is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPhoto'
              example:
                id: 65000000-0000-4000-8000-000000000001
                meal_id: 63000000-0000-4000-8000-000000000002
                analysis_status: pending
                image_url: https://voltik-cgm-staging.duckdns.org/v1/files/69000000-0000-4000-8000-000000000001?expires=1760620500&signature=4e1b9a0c7d2f
                image_url_expires_at: '2026-10-16T13:15:00Z'
                estimated_weight_g: null
                estimated_carbs_g: null
                estimated_calories_kcal: null
                confidence_percent: null
                low_confidence: false
                proposed_items: []
                analyzed_at: null
                confirmed_at: null
                created_at: '2026-10-16T13:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: The photo is larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: payload_too_large
                message: The photo must be at most 5 MB.
                details: []
        '415':
          description: The file is not a JPEG, PNG or WebP image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unsupported_media_type
                message: Send a JPEG, PNG or WebP image.
                details: []

